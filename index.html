<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11121c"><title>Pulse Hop</title><link rel="preload" href="./fonts/pulse-pixel.woff2" as="font" type="font/woff2" crossorigin></head><body><main data-screen="title"><header><strong>PULSE / HOP</strong><button id="mute" aria-label="音をミュート">♪ ON</button></header><div class="stats"><span id="score">HIT 000 / 300</span><span class="combo-group"><span id="combo">COMBO 0</span><span id="growth" role="meter" aria-label="彩り" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0" data-level="0"><span id="growth-label">彩り</span><span class="color-track" aria-hidden="true"><i id="growth-fill"></i></span></span></span></div><canvas aria-label="拍に合わせて足場を渡るゲーム"></canvas><section id="panel"><h1><img class="title-logo" src="./images/pulse-hop-logo.webp" width="1080" height="233" alt="PULSE HOP"></h1><p id="message">リズムに合わせて、どこでもタップ。</p><div id="precision" hidden><span>PERFECT<strong id="perfect-count">0</strong></span><span>GOOD<strong id="good-count">0</strong></span><span>MISS<strong id="miss-count">0</strong></span></div><div id="result-actions"><button id="start">音を出してはじめる</button><button id="share" hidden disabled>画像を準備中</button></div><p id="share-status" role="status" aria-live="polite"></p></section><footer><span id="hint">タップ / Space / Enter</span></footer></main><script type="module" src="/src/main.ts"></script></body></html>
